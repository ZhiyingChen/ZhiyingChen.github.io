baseURL = 'https://zhiyingchen.github.io/'
title = "Nicole Chen | Independent Professional"
theme = 'blowfish'
defaultContentLanguage = 'zh-cn'
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 100
disableKinds = ['taxonomy', 'term']
buildFuture = false

[languages.zh-cn]
  contentDir = 'content'
  hasCJKLanguage = true
  label = '简体中文'
  locale = 'zh-CN'
  weight = 1
  title = "Nicole Chen | Independent Professional"
  [languages.zh-cn.params]
    displayName = '中文'
    isoCode = 'zh-CN'
    dateFormat = '2006 年 1 月 2 日'
    description = 'Nicole Chen，制造业与供应链数字化专业人士。运筹优化、计划系统与可执行的业务决策。'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 30

[params]
  description = 'Nicole Chen，独立专业人士。让制造业的复杂决策变得更简单。'
  colorScheme = 'avocado'
  defaultAppearance = 'light'
  autoSwitchAppearance = false
  enableSearch = true
  enableCodeCopy = true
  disableImageZoom = false
  disableImageOptimization = true
  disableImageOptimizationMD = true
  disableTextInHeader = false
  mainSections = ['projects', 'cases']
  highlightCurrentMenuArea = true

  [params.author]
    name = 'Nicole Chen'
    email = 'nicolec1999@foxmail.com'
    headline = '运筹优化 · 数据建模 · 系统建设'
    links = [
      {github = 'https://github.com/ZhiyingChen'},
      {linkedin = 'https://www.linkedin.com/in/zhiying-chen-444978202/'},
      {email = 'mailto:nicolec1999@foxmail.com'}
    ]

  [params.header]
    layout = 'basic'

  [params.footer]
    showAppearanceSwitcher = false
    showScrollToTop = true

  [params.homepage]
    layout = 'custom'
    showRecent = false

  [params.article]
    showDate = false
    showAuthor = false
    showReadingTime = false
    showWordCount = false
    showTableOfContents = true

[languages.en]
  contentDir = 'content'
  hasCJKLanguage = false
  label = 'English'
  locale = 'en-US'
  weight = 2
  title = "Nicole Chen | Independent Professional"
