<div class="insight-list">{{ range .pages.ByDate.Reverse }}<article class="insight-row"><div class="insight-meta"><span>{{ .Params.category }}</span><time datetime="{{ .Date.Format `2006-01-02` }}">{{ .Date.Format "02 Jan 2006" }}</time><span>{{ .ReadingTime }} {{ if eq $.site.Language.Lang "en" }}min read{{ else }}分钟阅读{{ end }}</span></div><a href="{{ .RelPermalink }}"><h3>{{ .Title }} <span aria-hidden="true">↗</span></h3><p>{{ .Description }}</p></a></article>{{ end }}</div>
