{{- $destination := .Destination -}}
{{- if strings.HasPrefix $destination "/" -}}{{- $destination = strings.TrimPrefix "/" $destination | relLangURL -}}{{- end -}}
<a href="{{ $destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if or (strings.HasPrefix $destination "https://") (strings.HasPrefix $destination "http://") }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
