{{- $src := .Destination -}}
{{- if strings.HasPrefix $src "/" -}}{{- $src = strings.TrimPrefix "/" $src | relURL -}}{{- end -}}
{{- if eq .Title "inline-icon" -}}
<img src="{{ $src | safeURL }}" alt="{{ .PlainText }}" width="16" height="16" loading="lazy" style="width:16px;height:16px;display:inline-block">
{{- else -}}
<figure class="content-figure"><img src="{{ $src | safeURL }}" alt="{{ .PlainText }}" loading="lazy" decoding="async"{{ with .Title }} title="{{ . }}"{{ end }}>{{ with .Title }}<figcaption>{{ . }}</figcaption>{{ end }}</figure>
{{- end -}}
